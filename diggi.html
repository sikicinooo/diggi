        function getSavedCounter() {
            const raw = localStorage.getItem(COUNTER_STORAGE_KEY);
            if (raw === null) return 0;
            const parsed = parseInt(raw, 10);
            return Number.isFinite(parsed) && parsed >= 0 ? parsed : 0;
        }

        function setSavedCounter(value) {
            localStorage.setItem(COUNTER_STORAGE_KEY, String(value));
        }

        function buildPlusEmail(email, index) {
            const atIndex = email.indexOf("@");
            if (atIndex <= 0) return `${email}+${index}`;

            const localPart = email.substring(0, atIndex);
            const domainPart = email.substring(atIndex);
            const cleanLocal = localPart.includes("+") ? localPart.split("+")[0] : localPart;

            return `${cleanLocal}+${index}${domainPart}`;
        }

        const etAnswer1 = document.getElementById("etAnswer1");
        const etAnswer2 = document.getElementById("etAnswer2");
        const etRepeatCount = document.getElementById("etRepeatCount");
        const btnSend = document.getElementById("btnSend");
        const tvStatus = document.getElementById("tvStatus");

        btnSend.addEventListener("click", async () => {
            const a1 = etAnswer1.value.trim();
            const baseEmail = etAnswer2.value.trim() || "wekeytug@fuwamofu.com";
            const parsedCount = parseInt(etRepeatCount.value.trim(), 10);
            const repeatCount = Number.isFinite(parsedCount) && parsedCount >= 1 ? parsedCount : 1;

            etAnswer2.value = "";
            btnSend.disabled = true;

            let currentCounter = getSavedCounter();
            tvStatus.textContent = `Starte ${repeatCount} Durchlauf/Durchläufe (ab #${currentCounter + 1})...`;

            const logs = [];

            for (let i = 1; i <= repeatCount; i++) {
                currentCounter += 1;
                setSavedCounter(currentCounter);

                const numberedEmail = buildPlusEmail(baseEmail, currentCounter);
                tvStatus.textContent = [...logs, `[${i}/${repeatCount}] Sende an ${numberedEmail}...`].join("\n");

                        answer1: a1

                        answer1: numberedEmail
                    }
                ];

                    startDate: defaultStartDate,
                    submitDate: defaultSubmitDate,
                    answers: JSON.stringify(answersArray)
                });

                try {
                    const response = await fetch(endpointUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: bodyJson
                    });

                    if (response.ok) {
                        logs.push(`[${i}/${repeatCount}] Erfolgreich (${numberedEmail})`);
                    } else {
                        logs.push(`[${i}/${repeatCount}] Fehler (HTTP ${response.status}) – ${numberedEmail}`);
                    }
                } catch (err) {
                    logs.push(`[${i}/${repeatCount}] Fehler – ${numberedEmail}`);
                }
            }

            tvStatus.textContent = logs.join("\n");
            btnSend.disabled = false;
        });
